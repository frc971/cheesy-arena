<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FRC Scoreboard</title>

<style>
    body {
        margin: 0;
        background: #00ff00;
        font-family: Arial, Helvetica, sans-serif;
    }

    #scoreboard-wrapper {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 1000px;
    }

    #scoreboard {
        position: relative;
        height: 150px;
        display: flex;
        border: 1px solid #888;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .alliance {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        color: white;
    }

    .red { background: #ff4040; }
    .blue { background: #2f78d8; }

    .score {
        font-size: 72px;
        font-weight: bold;
    }

    /* HUB CIRCLES */
    .hub-circle {
        position: absolute;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid white;
        background: transparent;
        z-index: 2;
    }

    .blue .hub-circle { left: 20px; }
    .red .hub-circle { right: 20px; }

    .hub-active {
        background: white;
    }

    #center-circle {
        position: absolute;
        left: 50%;
        top: -40px;
        transform: translateX(-50%);
        width: 180px;
        height: 180px;
        background: #ddd;
        border-radius: 50%;
        border: 3px solid #888;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        z-index: 1;
    }

    #phase-time {
        font-size: 48px;
    }

    #current-phase {
        font-size: 16px;
        margin-top: 6px;
        color: #333;
    }

    #bottom-strip {
        height: 70px;
        background: #333;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 1px;
        border-left: 1px solid #888;
        border-right: 1px solid #888;
        border-bottom: 1px solid #888;
    }

</style>
</head>

<body>

<div id="scoreboard-wrapper">

    <div id="scoreboard">
        <div class="alliance blue">
            <div class="hub-circle" id="blue-hub"></div>
            <div class="score" id="blue-score">0</div>
        </div>

        <div class="alliance red">
            <div class="score" id="red-score">0</div>
            <div class="hub-circle" id="red-hub"></div>
        </div>

        <div id="center-circle">
            <div id="phase-time">0:00</div>
            <div id="current-phase">AUTO</div>
        </div>

    </div>

    <div id="bottom-strip">
        <span id="total-time">0:00</span>
    </div>

</div>

<script>
    const phaseTimeEl = document.getElementById("phase-time");
    const totalTimeEl = document.getElementById("total-time");
    const currentPhaseEl = document.getElementById("current-phase");
    const redScoreEl = document.getElementById("red-score");
    const blueScoreEl = document.getElementById("blue-score");
    const redHubEl = document.getElementById("red-hub");
    const blueHubEl = document.getElementById("blue-hub");

    const ws = new WebSocket(`ws://${location.host}/ws`);

    const overlay = document.createElement('div');
    overlay.id = 'final-overlay';
    overlay.style.position = 'fixed';
    overlay.style.inset = '0';
    overlay.style.display = 'none';
    overlay.style.alignItems = 'center';
    overlay.style.justifyContent = 'center';
    // solid black to fully obscure the scoreboard underneath
    overlay.style.background = '#000';
    overlay.style.zIndex = '9999';
    // Final overlay: two full-height halves (left=blue, right=red) styled like the reference image
    overlay.style.display = 'none';
    overlay.style.flexDirection = 'row';
    overlay.style.padding = '0';
    overlay.style.margin = '0';
    overlay.style.width = '100vw';
    overlay.style.height = '100vh';
    overlay.style.background = '#000';
    overlay.style.gap = '0';
    overlay.innerHTML = `
      <div style="flex:1; min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#0f68a8;">
        <div style="font-size:4vmin; color:rgba(255,255,255,0.95); font-weight:800; letter-spacing:4px; margin-bottom:4vmin; text-shadow:0 2px 6px rgba(0,0,0,0.5);">BLUE</div>
        <div id="final-blue" style="color:#ffffff; font-weight:900; line-height:1; font-size:clamp(140px,28vw,420px); text-shadow:0 10px 24px rgba(0,0,0,0.5);">0</div>
      </div>
      <div style="flex:1; min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#a30b0b;">
        <div style="font-size:4vmin; color:rgba(255,255,255,0.95); font-weight:800; letter-spacing:4px; margin-bottom:4vmin; text-shadow:0 2px 6px rgba(0,0,0,0.5);">RED</div>
        <div id="final-red" style="color:#ffffff; font-weight:900; line-height:1; font-size:clamp(140px,28vw,420px); text-shadow:0 10px 24px rgba(0,0,0,0.5);">0</div>
      </div>
    `;
    document.body.appendChild(overlay);

    // reference to the scoreboard wrapper so it can be hidden while final overlay is shown
    const wrapper = document.getElementById('scoreboard-wrapper');

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        phaseTimeEl.textContent = data.time_left_in_phase;
        totalTimeEl.textContent = data.total_time_left;
        currentPhaseEl.textContent = data.current_phase;
        redScoreEl.textContent = data.red_score;
        blueScoreEl.textContent = data.blue_score;

        redHubEl.classList.remove("hub-active");
        blueHubEl.classList.remove("hub-active");

        if (data.hub_active === "RED") {
            redHubEl.classList.add("hub-active");
        } else if (data.hub_active === "BLUE") {
            blueHubEl.classList.add("hub-active");
        } else if (data.hub_active === "BOTH") {
            redHubEl.classList.add("hub-active");
            blueHubEl.classList.add("hub-active");
        }

        // Match-over overlay handling
        try {
          if (data.show_final) {
            document.getElementById('final-red').textContent = data.final_red ?? data.red_score ?? 0;
            document.getElementById('final-blue').textContent = data.final_blue ?? data.blue_score ?? 0;
            // ensure overlay fully black and visible
            overlay.style.background = '#000';
            overlay.style.display = 'flex';
            if (typeof wrapper !== 'undefined' && wrapper) {
              wrapper.style.visibility = 'hidden';
            }
          } else {
            overlay.style.display = 'none';
            if (typeof wrapper !== 'undefined' && wrapper) {
              wrapper.style.visibility = 'visible';
            }
          }
        } catch (e) {
          console.error('Overlay error', e);
        }
    };
</script>

</body>
</html>
